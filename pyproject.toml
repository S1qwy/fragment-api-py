[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "fragment-api-py"
version = "12.0.0"
description = "Async Python library for Fragment.com API with seqno/balance confirmation and confirmReq"
readme = "README.md"
authors = [{name = "S1qwy", email = "S1qwy@internet.ru"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.4",
    "tonutils>=0.4.0",
    "pynacl>=1.5.0",
    "ton-core>=0.1.0",
    "pydantic>=2.0",
    "selectolax>=0.3.0",
    "aiofiles>=23.0",
    "marketapp-api>=1.0.1"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]

[project.optional-dependencies]
dev = [
    "python-semantic-release>=9.0.0",
]

[tool.flit.module]
name = "FragmentAPI"

[tool.semantic_release]
version_variable = "pyproject.toml:project.version"
upload_to_pypi = true
upload_to_release = true
build_command = "python -m build"
dist_dir = "dist/"
commit_subject = "chore(release): bump version {version}"
tag_format = "v{version}"
branches = { "master" = "main" }
changelog_file = "CHANGELOG.md"
changelog_components = [
    {component = "feat", description = "Новые возможности", type = "feature"},
    {component = "fix", description = "Исправления багов", type = "fix"},
    {component = "docs", description = "Документация", type = "docs"},
    {component = "refactor", description = "Рефакторинг", type = "refactor"},
    {component = "perf", description = "Оптимизация производительности", type = "performance"},
    {component = "ci", description = "CI/CD", type = "ci"},
    {component = "test", description = "Тесты", type = "test"},
]