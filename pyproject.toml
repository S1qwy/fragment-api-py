[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "fragment-api-py"
version = "13.0.0"
description = "Async Fragment client with reusable transport, wallet authentication, external signing, and explicit payment receipts"
readme = "README.md"
authors = [{name = "S1qwy", email = "S1qwy@internet.ru"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.4",
    "tonutils>=0.4.0",
    "pynacl>=1.5.0",
    "ton-core>=0.1.0",
    "pydantic>=2.0",
    "selectolax>=0.3.0",
    "aiofiles>=23.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO"
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
qr = ["qrcode>=7.4"]
dev = [
    "python-semantic-release>=9.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.0"
]

[tool.flit.module]
name = "FragmentAPI"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["FragmentAPI/__init__.py:__version__"]
build_command = "python -m build"
tag_format = "v{version}"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"