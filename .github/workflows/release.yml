name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Create ~/.pypirc with token
        run: |
          mkdir -p ~
          cat > ~/.pypirc << EOF
          [pypi]
          username = __token__
          password = ${{ secrets.PYPI_TOKEN }}
          EOF

      - name: Semantic Release
        id: release
        run: |
          semantic-release version
          semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
