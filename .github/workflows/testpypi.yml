name: TestPyPI smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-smoke-test
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set test version in the build workspace
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          for filename, field in (
              ("pyproject.toml", "version"),
              ("FragmentAPI/__init__.py", "__version__"),
          ):
              path = Path(filename)
              source, count = re.subn(
                  rf'^{field} = "[^"]+"$',
                  f'{field} = "10000.0.0"',
                  path.read_text(encoding="utf-8"),
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Expected one version field in {filename}")
              path.write_text(source, encoding="utf-8")
          PY

      - name: Build and validate test distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: test-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
